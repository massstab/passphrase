<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passphrase Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="top-buttons">
      <button id="langDeButton">Deutsch</button>
      <button id="langEnButton">English</button>
      <button id="darkModeButton">🌙 Dark Mode</button>
    </div>

    <h1 id="title"></h1>

    <div class="option-group">
      <label id="fileLabel"></label>
      <input type="file" id="fileInput" accept=".txt" />
    </div>

    <div class="option-group">
      <label id="numWordsLabel"></label>
      <input type="number" id="numWords" value="4" min="3" max="12" />
    </div>

    <div class="option-group">
      <label id="caseLabel"></label>
      <select id="caseStyle">
        <option value="lowercase" id="lowercaseOption"></option>
        <option value="capitalized" id="capitalizedOption"></option>
        <option value="uppercase" id="uppercaseOption"></option>
      </select>
    </div>

    <div class="option-group">
      <label id="specialCharsLabel"></label>
      <input type="checkbox" id="specialChars" />
      <span id="yesText"></span>
    </div>

    <div class="option-group">
      <label id="includeNumbersLabel"></label>
      <input type="checkbox" id="includeNumbers" />
      <span id="yesText2"></span>
    </div>

    <div class="option-group">
      <label id="delimiterLabel"></label>
      <input type="text" id="delimiter" value="-" placeholder="" />
    </div>

    <div class="buttons option-group">
      <button id="generateButton"></button>
      <button id="copyButton"></button>
    </div>

    <h3 id="generatedLabel"></h3>
    <p id="passphrase"></p>
    <p id="error"></p>
    <p id="success"></p>
    <p id="clipboardWarning"></p>
  </div>

  <script src="script_i18n.js"></script>
</body>
</html>
